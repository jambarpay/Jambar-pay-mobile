name: jambar_pay_mobile
description: "Application mobile Jambar Pay."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  http: ^1.2.2
  mobile_scanner: ^7.1.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  go_router: ^17.3.0
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^10.3.1
  
  # State Management - BLoC
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^9.2.1
  
  # Date/Time handling
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # App icon generation
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/IconeAppli.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
